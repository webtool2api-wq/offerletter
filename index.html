<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offer Letter PDF Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--surf:#f1f4f8;--ink:#0b1b3a;--mute:#5a6781;--blue:#1e6bff;--line:#d5dce8;--err:#b42318;--desk:#8a93a3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1220;--surf:#141d30;--ink:#e8eefc;--mute:#9aa8c7;--blue:#4c8dff;--line:#26324d;--err:#ff7b72;--desk:#2a3245}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1220;--surf:#141d30;--ink:#e8eefc;--mute:#9aa8c7;--blue:#4c8dff;--line:#26324d;--err:#ff7b72;--desk:#2a3245}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 Calibri,Carlito,system-ui,sans-serif}
#app{display:flex;height:100%}
#ctl{width:460px;flex:none;overflow-y:auto;padding:16px;border-right:1px solid var(--line)}
#pv{flex:1;min-width:0;overflow:auto;background:var(--desk);padding:20px}
.pgc{display:block;width:100%;max-width:720px;margin:0 auto 18px;box-shadow:0 2px 10px rgba(0,0,0,.35);background:#fff}
h1{font-size:20px;margin:0}.m{color:var(--mute);margin:2px 0 10px;font-size:13px}
.er{color:var(--err);min-height:0;margin-bottom:6px}
details{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:0 12px}
summary{cursor:pointer;font-weight:700;padding:10px 0}
details[open]{padding-bottom:10px}
label{display:block;font-size:12px;color:var(--mute);margin-top:8px}
input,textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin-top:2px}
textarea{resize:vertical}
input[type=checkbox]{width:auto}
button{font:inherit;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer;margin:8px 6px 0 0}
.go{display:block;width:100%;background:var(--blue);color:#fff;border:0;padding:13px;font-size:16px;font-weight:700;margin:6px 0 0;position:sticky;bottom:0}
.sc{overflow-x:auto;margin-top:8px}
.ed{border-collapse:collapse}.ed td,.ed th{padding:2px;vertical-align:top;min-width:96px}
.ed .sn{min-width:24px;text-align:center;color:var(--mute)}
.ed th textarea{text-align:center;font-weight:700;min-height:34px}
.ed th button,.ed td button,.tr button{margin:0;padding:2px 6px}
.tr{display:grid;grid-template-columns:90px 1fr auto;gap:4px;margin-top:6px}
.tr textarea{min-height:32px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tb button{margin:0}
[hidden]{display:none!important}
button:disabled{opacity:.5;cursor:not-allowed}
.bad{border-color:var(--err)!important}
.ck{display:block;font-size:11px;color:var(--mute);margin:0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#rt{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#bar button{margin:0}#bar label{margin:0;color:var(--ink);font-size:14px;font-weight:700}
#bar input[type=checkbox],input[type=radio]{width:auto}
.dlb{background:var(--blue)!important;color:#fff!important;border:0!important;padding:8px 16px!important;font-weight:700}
dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:min(92vw,420px)}dialog::backdrop{background:rgba(0,0,0,.5)}
.op{display:block;font-size:14px;color:var(--ink);margin:6px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:820px){#app{flex-direction:column;height:auto}#ctl{width:auto;border:0;overflow:visible}#pv{overflow:visible}#rt{display:block}}
</style>
</head>
<body>
<div id="app">
<aside id="ctl">
<h1>Offer Letter PDF</h1><p class="m">A4 · runs in your browser · nothing is uploaded</p><div id="err" class="er" role="status"></div><div id="ver" class="er" role="status"></div>
<details open><summary>Letter</summary>
<div class="row3"><label>Prefix<input data-k="rp" placeholder="e.g. FPH"></label><label>Customer code<input data-k="rc" placeholder="e.g. NLC"></label><label>Serial no.<input type="number" min="1" data-k="rn"></label></div>
<label>Ref number (automatic, or type your own)<input data-k="ref" placeholder="e.g. FPH: NLC: 0230: 26"></label>
<label>Date<input type="date" data-k="date"></label>
<label>Address<textarea data-k="addr" rows="5" placeholder="Name, department, address"></textarea></label>
<label>Greeting<input data-k="sal" placeholder="e.g. Dear Sir,"></label>
<label>Subject<textarea data-k="subj" rows="2" placeholder="Subject line"></textarea></label>
<label>Opening line<textarea data-k="intro" rows="2" placeholder="Opening line before the table"></textarea></label>
</details>
<details open><summary>Table (1 to 6 columns)</summary>
<div class="tb"><input type="number" id="nr" min="1" max="50" value="1" title="How many rows to add" aria-label="How many rows to add" style="width:64px;margin:0"><button id="ar">+ Row</button><button id="ac">+ Column</button><button id="dl">Delete…</button></div>
<div class="tb" id="db" hidden><span class="m">Tick the rows or columns to delete.</span><button id="dd" disabled>Delete selected (0)</button><button id="dx">Cancel</button></div>
<label>Rows per page (1 to 8)<input type="number" min="1" max="8" data-k="per"></label>
<div class="sc"><div id="ed"></div></div>

<label>Note under table<input data-k="note" placeholder="Optional note"></label>
</details>
<details><summary>Terms and conditions</summary><div id="tm"></div><button id="at">+ Term</button></details>
<details><summary>Closing and signature</summary>
<label>Closing paragraph<textarea data-k="close" rows="3"></textarea></label>
<label>Line 1<input data-k="thx"></label><label>Line 2<input data-k="yf1"></label>
<label>Company line<input data-k="yf2"></label><label>Signatory line<input data-k="auth"></label>
</details>
<details><summary>Page space, stamp and font</summary>
<div class="row2"><label>Top space (mm)<input type="number" min="0" max="100" data-k="top"></label><label>Bottom space (mm)<input type="number" min="0" max="100" data-k="bot"></label></div>
<label>Stamp image (PNG or JPG)</label><input type="file" id="stf" accept="image/png,image/jpeg"><button id="str">Remove stamp</button>
<div class="row2"><label>Size (pt)<input type="number" data-k="ss"></label><label>Across (pt)<input type="number" data-k="sx"></label></div>
<label>Up / down (pt)<input type="number" data-k="sy"></label>
<label>Calibri regular (calibri.ttf)</label><input type="file" id="fr" accept=".ttf,.otf">
<label>Calibri bold (calibrib.ttf)</label><input type="file" id="fb" accept=".ttf,.otf">
<p class="m" id="fs"></p>
<label><input type="checkbox" data-k="bump"> Add 1 to the Ref number after each download</label>
</details>
</aside>
<div id="rt"><div id="bar"><label><input type="checkbox" id="ds" checked> Save draft</label><span class="m" id="dst" style="margin:0"></span><span style="flex:1"></span><button id="uc" hidden>Undo clear</button><button id="cl">Clear…</button><button class="dlb" id="dlb">Download PDF</button></div><main id="pv"></main></div>
</div>
<dialog id="cd"><b>Clear fields</b><p class="m">Clear everything, or choose which parts to clear? You can undo right after.</p>
<label class="op"><input type="radio" name="cm" value="all" checked> All fields</label>
<label class="op"><input type="radio" name="cm" value="pick"> Choose items</label>
<div id="ci" hidden><label class="op"><input type="checkbox" value="letter"> Address, greeting, subject, opening line</label><label class="op"><input type="checkbox" value="table"> Table contents (columns and rows stay)</label><label class="op"><input type="checkbox" value="note"> Note under table</label><label class="op"><input type="checkbox" value="terms"> Terms and conditions</label><label class="op"><input type="checkbox" value="closing"> Closing and signature lines</label><label class="op"><input type="checkbox" value="stamp"> Stamp image</label></div>
<p class="er" id="cm2"></p><div class="tb"><button id="cy">Clear</button><button id="cn">Cancel</button></div></dialog>

  m.ls.forEach((ls,i)=>ls.forEach((s,k)=>{if(!s)return;const c=m.hdr||i!==1;o.push({t:"t",s,x:c?xs[i]+(cw[i]-tw(s,m.hdr,m.z))/2:xs[i]+5,y:y+5+k*13+m.z*.8,b:m.hdr?1:0,z:m.z})}));y+=m.h};
 const hm=mz(S.cols,1);if(y+hm.h+40>botY)np();dr(hm);
 S.rows.forEach((r,i)=>{const m=mz([String(i+1),...r],0);if(y+m.h>botY||cnt>=S.per)np();dr(m);cnt++});
 const tail=g=>{if(g)y+=12;if(S.note){blk(S.note);y+=10}
 if(S.terms.length){const T="TERMS & CONDITIONS:-";blk(T,L,CW,1);cur().push({t:"l",x1:L,y1:y-2.5,x2:L+tw(T,1,11),y2:y-2.5});y+=4;
  S.terms.forEach(([k,v],i)=>{const ls=wrap(": "+v,0,11,CW-110),h=ls.length*14;if(y+h>botY)np();const o=cur();o.push({t:"t",s:(i+1)+". "+k,x:L,y:y+8.8,b:0,z:11});ls.forEach((s,j)=>s&&o.push({t:"t",s,x:L+108,y:y+j*14+8.8,b:0,z:11}));y+=h});y+=12}
 blk(S.close);y+=10;blk(S.thx);y+=8;
 if(y+122>botY)np();
 const sy=y;blk(S.yf1);blk(S.yf2);y+=66;blk(S.auth);
 if(st&&S.stamp){const w=+S.ss||90;cur().push({t:"i",d:S.stamp,x:L+(+S.sx||0),y:sy+(+S.sy||0),w,h:w*st[1]/st[0]})}};
 const pn=pages.length,y0=y,n0=cur().length;tail(1);
 if(pages.length>pn){pages.length=pn;pages[pn-1].length=n0;y=y0;np();tail(0)}
 return pages}
function draw(pages){const pv=$("pv");pv.innerHTML="";const ff=FB.r?"PM,Arial,sans-serif":"Arial,Helvetica,sans-serif",k=1.6;
 pages.forEach(o=>{const c=document.createElement("canvas");c.width=W*k;c.height=H*k;c.className="pgc";const x=c.getContext("2d");x.scale(k,k);x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#000";x.strokeStyle="#000";x.lineWidth=.7;
  o.forEach(p=>{if(p.t==="t"){x.font=(p.b?"bold ":"")+p.z+"px "+ff;x.fillText(p.s,p.x,p.y)}else if(p.t==="l"){x.beginPath();x.moveTo(p.x1,p.y1);x.lineTo(p.x2,p.y2);x.stroke()}else if(imgs[p.d])x.drawImage(imgs[p.d],p.x,p.y,p.w,p.h)});pv.append(c)})}
async function refresh(){const q=++rs;try{await fonts();const p=await layout();if(q!==rs)return;draw(p);$("err").textContent=""}catch(e){$("err").textContent="Cannot render: "+(e.message||e)+". If a character is not supported, upload the Calibri font files."}}
async function download(){const ev=validate();if(ev.length){$("ver").textContent=ev.join(" · ");$("err").textContent="Fix the highlighted items before downloading.";return}const b=$("dlb");b.disabled=true;try{await fonts();const pages=await layout(),doc=await PDFDocument.create();if(window.fontkit)doc.registerFontkit(fontkit);
 const fr=FB.r?await doc.embedFont(FB.r):await doc.embedFont(StandardFonts.Helvetica),fb=FB.b?await doc.embedFont(FB.b):await doc.embedFont(StandardFonts.HelveticaBold),ca={};
 for(const o of pages){const g=doc.addPage([W,H]);for(const p of o){
  if(p.t==="t")g.drawText(p.s,{x:p.x,y:H-p.y,size:p.z,font:p.b?fb:fr,color:rgb(0,0,0)});
  else if(p.t==="l")g.drawLine({start:{x:p.x1,y:H-p.y1},end:{x:p.x2,y:H-p.y2},thickness:.7,color:rgb(0,0,0)});
  else{if(!ca[p.d])ca[p.d]=/^data:image\/png/.test(p.d)?await doc.embedPng(u8(p.d)):await doc.embedJpg(u8(p.d));g.drawImage(ca[p.d],{x:p.x,y:H-p.y-p.h,width:p.w,height:p.h})}}}
 const bytes=await doc.save(),name="Offer-"+(S.ref||"letter").replace(/[^\w]+/g,"-")+".pdf";
 if(dl)await dl.save({filename:name,data:bytes});else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));a.download=name;document.body.append(a);a.click();a.remove()}
 if(S.bump){if(S.manual){S.ref=bumpRef(S.ref);parts()}else S.rn=(+S.rn||0)+1;upd();["rp","rc","rn","ref"].forEach(x=>document.querySelector('[data-k="'+x+'"]').value=S[x])}
 $("err").textContent=""}catch(e){if(!e||e.code!=="declined")$("err").textContent="Could not create PDF: "+(e.message||e.code||e)}b.disabled=false}
function edit(){const n=S.cols.length;$("ac").disabled=n>=6;let h='<table class="ed"><tr>'+S.cols.map((c,i)=>'<th>'+(dmode&&i>0?'<label class="ck"><input type="checkbox" data-sc="'+i+'"'+(sc.has(i)?" checked":"")+'> delete column</label>':"")+'<textarea data-c="'+i+'" rows="1" aria-label="Column name">'+esc(c)+'</textarea></th>').join("")+"</tr>";
 S.rows.forEach((r,ri)=>{h+='<tr><td class="sn">'+(dmode?'<input type="checkbox" data-sr="'+ri+'" aria-label="Delete row '+(ri+1)+'"'+(sr.has(ri)?" checked":"")+'><br>':"")+(ri+1)+"</td>"+r.map((v,j)=>'<td><textarea data-r="'+ri+'" data-j="'+j+'" rows="'+(j?1:3)+'">'+esc(v)+"</textarea></td>").join("")+"</tr>"});
 $("ed").innerHTML=h+"</table>";document.querySelectorAll("#ed textarea").forEach(t=>{if(t.scrollHeight)grow(t)});
 $("tm").innerHTML=S.terms.map((t,i)=>'<div class="tr"><input data-ti="'+i+'" data-tp="0" value="'+esc(t[0])+'" placeholder="Heading"><textarea data-ti="'+i+'" data-tp="1" rows="2" placeholder="Details">'+esc(t[1])+'</textarea><button data-dt="'+i+'" aria-label="Remove term">✕</button></div>').join("")}
const grow=t=>{t.style.height="auto";t.style.height=t.scrollHeight+"px"};
$("ed").addEventListener("input",e=>{const d=e.target.dataset;if(e.target.tagName==="TEXTAREA"&&e.target.scrollHeight)grow(e.target);if(d.c!==undefined)S.cols[+d.c]=e.target.value;else if(d.r!==undefined)S.rows[+d.r][+d.j]=e.target.value;upd()});
$("ed").addEventListener("click",e=>{const d=e.target.dataset;if(d.rc){S.cols.splice(+d.rc,1);S.rows.forEach(r=>r.splice(+d.rc-1,1))}else if(d.dr)S.rows.splice(+d.dr,1);else return;edit();upd()});
$("tm").addEventListener("input",e=>{const d=e.target.dataset;if(d.ti!==undefined){S.terms[+d.ti][+d.tp]=e.target.value;upd()}});

let dmode=false;const sr=new Set(),sc=new Set();
const cntSel=()=>{$("dd").textContent="Delete selected ("+(sr.size+sc.size)+")";$("dd").disabled=!(sr.size+sc.size)};
const mode=on=>{dmode=on;sr.clear();sc.clear();$("db").hidden=!on;$("dl").hidden=on;edit();cntSel()};

$("ed").addEventListener("change",e=>{const d=e.target.dataset;if(d.sc!==undefined)e.target.checked?sc.add(+d.sc):sc.delete(+d.sc);else if(d.sr!==undefined)e.target.checked?sr.add(+d.sr):sr.delete(+d.sr);else return;cntSel()});
document.querySelectorAll("[data-k]").forEach(e=>{const k=e.dataset.k;if(e.type==="checkbox")e.checked=!!S[k];else e.value=S[k];
 e.oninput=()=>{const v=e.value;if(k==="ref")S.manual=true;if(k==="rp"||k==="rc"||k==="rn")S.manual=false;S[k]=e.type==="checkbox"?e.checked:e.type==="number"?(k==="per"?(Number.isInteger(+v)&&+v>=1&&+v<=8?+v:S.per):k==="top"||k==="bot"?Math.min(100,Math.max(0,+v||0)):k==="ss"?Math.min(300,Math.max(20,+v||90)):(+v||0)):v;if(k==="ref"){parts();["rp","rc","rn"].forEach(x=>document.querySelector('[data-k="'+x+'"]').value=S[x])}upd()}});
$("stf").onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg)$/.test(f.type)){$("err").textContent="Stamp must be a PNG or JPG.";return}

 $("fs").textContent=(FB.r?"Regular font loaded. ":"No regular font: using Arial-style. ")+(FB.b?"Bold font loaded.":"No bold font: using Arial-style bold.")}
function fup(id,k){$(id).onchange=async e=>{const f=e.target.files[0];if(!f)return;const b=new Uint8Array(await f.arrayBuffer()),m=String.fromCharCode(...b.slice(0,4));
 if(!(m==="\0\x01\0\0"||m==="true"||m==="OTTO")){$("err").textContent="That does not look like a font file (.ttf or .otf).";return}
 FB[k]=b;await idb("put",k,b);fd=true;face();upd()}}
fup("fr","r");fup("fb","b");$("dlb").onclick=download;

let snap=null;
const clr={letter:()=>{S.addr=S.sal=S.subj=S.intro=""},table:()=>{S.rows=S.rows.map(r=>r.map(()=>""))},note:()=>{S.note=""},terms:()=>{S.terms=[]},closing:()=>{S.close=S.thx=S.yf1=S.yf2=S.auth=""},stamp:()=>{S.stamp="";$("stf").value=""}};
